<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DJZS Torus Logo — Brand Colors</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0F1118; 
    color: #fff; 
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    min-height: 100vh;
  }
  h1 { 
    font-size: 14px; 
    letter-spacing: 4px; 
    color: rgba(243,126,32,0.4); 
    margin-bottom: 30px;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 1px solid rgba(243,126,32,0.2);
    background: rgba(243,126,32,0.03);
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover {
    border-color: rgba(243,126,32,0.5);
    color: #fff;
    background: rgba(243,126,32,0.08);
  }
  button.active {
    border-color: rgba(243,126,32,0.6);
    color: #F37E20;
    background: rgba(243,126,32,0.1);
    box-shadow: 0 0 20px rgba(243,126,32,0.12);
  }
  button.export-btn {
    border-color: rgba(46,139,139,0.5);
    color: rgba(46,139,139,0.9);
    background: rgba(46,139,139,0.05);
  }
  button.export-btn:hover {
    background: rgba(46,139,139,0.12);
    box-shadow: 0 0 20px rgba(46,139,139,0.15);
    color: #fff;
  }
  .canvas-wrap {
    position: relative;
    border: 1px solid rgba(243,126,32,0.08);
  }
  canvas { display: block; }
  .info {
    margin-top: 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 1px;
    text-align: center;
  }
  .preview-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(243,126,32,0.25);
    margin-bottom: 10px;
  }
  .palette {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .swatch {
    width: 32px;
    height: 32px;
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
  }
  .swatch::after {
    content: attr(data-label);
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: rgba(255,255,255,0.2);
    white-space: nowrap;
  }
</style>
</head>
<body>

<h1>DJZS.ai — Torus Logo Generator</h1>

<div class="palette">
  <div class="swatch" style="background:#F37E20" data-label="orange"></div>
  <div class="swatch" style="background:#2E8B8B" data-label="teal"></div>
  <div class="swatch" style="background:#FFB84D" data-label="gold"></div>
  <div class="swatch" style="background:#7B6B8D" data-label="purple"></div>
  <div class="swatch" style="background:#0F1118" data-label="bg"></div>
</div>

<div class="controls">
  <button class="active" onclick="setVariant('clean')" id="btn-clean">Clean</button>
  <button onclick="setVariant('branded')" id="btn-branded">Branded</button>
  <button onclick="setVariant('fire')" id="btn-fire">Full Burn</button>
  <button onclick="captureFrame(2048)" class="export-btn">Export 2048px</button>
  <button onclick="captureFrame(4096)" class="export-btn">Export 4096px</button>
</div>

<div class="preview-label">LIVE PREVIEW — 512×512</div>
<div class="canvas-wrap">
  <canvas id="preview" width="512" height="512"></canvas>
</div>

<div class="info">
  // BRAND: #F37E20 + #2E8B8B + #FFB84D on #0F1118<br>
  // HOVER TO ACCELERATE
</div>

<script>
// ── DJZS.ai Brand Palette ──
const BRAND = {
  orange: [243, 126, 32],    // #F37E20 — primary
  teal:   [46, 139, 139],    // #2E8B8B — secondary  
  gold:   [255, 184, 77],    // #FFB84D — accent
  purple: [123, 107, 141],   // #7B6B8D — muted
  bg:     [15, 17, 24],      // #0F1118 — background
};

const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');
let time = 0;
let hovered = false;
let variant = 'clean';
let animId = 0;

canvas.addEventListener('mouseenter', () => hovered = true);
canvas.addEventListener('mouseleave', () => hovered = false);

function setVariant(v) {
  variant = v;
  document.querySelectorAll('.controls button:not(.export-btn)').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + v).classList.add('active');
}

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  return [lerp(c1[0],c2[0],t)|0, lerp(c1[1],c2[1],t)|0, lerp(c1[2],c2[2],t)|0];
}

function renderTorus(targetCtx, size, currentTime, variantOverride) {
  const v = variantOverride || variant;
  const w = size;
  const h = size;
  const cx = w / 2;
  const cy = h / 2;
  
  const isExport = size > 512;
  const trailFrames = isExport ? 80 : 1;
  const baseTime = currentTime;
  
  // Brand background
  const [bgR, bgG, bgB] = BRAND.bg;
  targetCtx.fillStyle = `rgb(${bgR},${bgG},${bgB})`;
  targetCtx.fillRect(0, 0, w, h);
  
  for (let frame = 0; frame < trailFrames; frame++) {
    const t = baseTime - (trailFrames - frame) * 0.022;
    const frameProgress = frame / trailFrames;
    const trailAlpha = isExport ? 0.04 + frameProgress * 0.1 : 1;
    
    if (!isExport) {
      targetCtx.fillStyle = `rgba(${bgR},${bgG},${bgB}, 0.1)`;
      targetCtx.fillRect(0, 0, w, h);
    }
    
    const R = w * 0.26;
    const r = w * 0.105;
    
    const uStep = isExport ? 0.07 : 0.12;
    const vStep = isExport ? 0.07 : 0.12;
    
    for (let u = 0; u < Math.PI * 2; u += uStep) {
      for (let v2 = 0; v2 < Math.PI * 2; v2 += vStep) {
        const x = (R + r * Math.cos(v2)) * Math.cos(u);
        const y = (R + r * Math.cos(v2)) * Math.sin(u);
        const z = r * Math.sin(v2);
        
        const rotY = y * Math.cos(t) - z * Math.sin(t);
        const rotZ = y * Math.sin(t) + z * Math.cos(t);
        
        const scale = (w * 0.55) / (w * 0.55 + rotZ);
        const projX = cx + x * scale;
        const projY = cy + rotY * scale;
        
        const depth = (rotZ + r) / (2 * r);
        let alpha = (0.12 + depth * 0.7) * trailAlpha;
        const pointSize = Math.max(0.5, (isExport ? 2.0 : 1.4) * scale);
        
        // ── Color mapping by position + depth ──
        // Front faces (high depth) → orange/gold
        // Back faces (low depth) → teal
        // Creates the brand gradient across the torus surface
        let color;
        const angleFactor = (Math.sin(u * 2 + t * 0.5) + 1) / 2; // 0-1 wave
        
        if (v === 'fire') {
          // Full burn: orange → gold → white at bright points
          const heat = depth * 0.7 + angleFactor * 0.3;
          if (heat > 0.7) {
            color = lerpColor(BRAND.gold, [255,240,220], (heat-0.7)/0.3);
            alpha *= 1.4;
          } else if (heat > 0.35) {
            color = lerpColor(BRAND.orange, BRAND.gold, (heat-0.35)/0.35);
          } else {
            color = lerpColor(BRAND.teal, BRAND.orange, heat/0.35);
          }
        } else {
          // Clean / Branded: orange front, teal back, gold highlights
          if (depth > 0.6) {
            // Front — orange to gold
            color = lerpColor(BRAND.orange, BRAND.gold, (depth - 0.6) / 0.4);
          } else if (depth > 0.3) {
            // Mid — teal to orange transition
            color = lerpColor(BRAND.teal, BRAND.orange, (depth - 0.3) / 0.3);
          } else {
            // Back — deep teal, fading into purple
            color = lerpColor(BRAND.purple, BRAND.teal, depth / 0.3);
            alpha *= 0.7;
          }
        }
        
        targetCtx.beginPath();
        targetCtx.arc(projX, projY, pointSize, 0, Math.PI * 2);
        targetCtx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${Math.min(1, alpha)})`;
        targetCtx.fill();
        
        // Bright specular highlights on front faces
        if (!isExport && depth > 0.8 && Math.random() > 0.97) {
          targetCtx.fillStyle = `rgba(255, 240, 220, ${0.5 + depth * 0.3})`;
          targetCtx.fill();
        }
      }
    }
  }
  
  // ── Center glow — warm orange core ──
  const glowMult = v === 'fire' ? 2.0 : 1.0;
  const R_t = w * 0.26;
  const r_t = w * 0.105;
  
  // Outer warm glow
  const g1 = targetCtx.createRadialGradient(cx, cy, 0, cx, cy, R_t * 0.85);
  g1.addColorStop(0, `rgba(243, 126, 32, ${0.12 * glowMult})`);
  g1.addColorStop(0.3, `rgba(255, 184, 77, ${0.06 * glowMult})`);
  g1.addColorStop(0.6, `rgba(46, 139, 139, ${0.03 * glowMult})`);
  g1.addColorStop(1, 'rgba(0, 0, 0, 0)');
  targetCtx.fillStyle = g1;
  targetCtx.fillRect(0, 0, w, h);
  
  // Inner core — hot white/gold
  const g2 = targetCtx.createRadialGradient(cx, cy, 0, cx, cy, r_t * 1.3);
  g2.addColorStop(0, `rgba(255, 240, 220, ${0.18 * glowMult})`);
  g2.addColorStop(0.3, `rgba(243, 126, 32, ${0.08 * glowMult})`);
  g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
  targetCtx.fillStyle = g2;
  targetCtx.fillRect(0, 0, w, h);
  
  // Zero-point dot — warm
  const dotAlpha = 0.5 + Math.sin(baseTime * 3) * 0.2;
  const dotSize = isExport ? w * 0.004 : 1.5;
  targetCtx.beginPath();
  targetCtx.arc(cx, cy, dotSize, 0, Math.PI * 2);
  targetCtx.fillStyle = `rgba(255, 220, 180, ${dotAlpha})`;
  targetCtx.fill();
  
  // Branded variant — text below
  if (v === 'branded') {
    const fontSize = w * 0.04;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    
    const textY = cy + R_t + r_t + w * 0.07;
    
    // DJZS — orange with glow
    targetCtx.shadowColor = 'rgba(243, 126, 32, 0.5)';
    targetCtx.shadowBlur = w * 0.02;
    targetCtx.font = `700 ${fontSize}px "JetBrains Mono", "Fira Code", monospace`;
    targetCtx.fillStyle = '#F37E20';
    targetCtx.fillText('DJZS', cx, textY);
    
    // .ai in purple
    const djzsWidth = targetCtx.measureText('DJZS').width;
    targetCtx.shadowBlur = 0;
    targetCtx.font = `700 ${fontSize}px "JetBrains Mono", "Fira Code", monospace`;
    // Re-render as two parts for color split
    targetCtx.fillStyle = '#F37E20';
    const leftX = cx - djzsWidth * 0.15;
    targetCtx.fillText('DJZS', leftX, textY);
    
    targetCtx.fillStyle = '#7B6B8D';
    const aiX = leftX + djzsWidth * 0.52;
    targetCtx.font = `700 ${fontSize * 0.9}px "JetBrains Mono", "Fira Code", monospace`;
    targetCtx.fillText('.ai', aiX, textY);
    
    // Tagline — teal
    targetCtx.shadowBlur = 0;
    targetCtx.font = `400 ${fontSize * 0.35}px "JetBrains Mono", "Fira Code", monospace`;
    targetCtx.fillStyle = 'rgba(46, 139, 139, 0.7)';
    targetCtx.fillText('THE API TOLLBOOTH FOR THE A2A ECONOMY', cx, textY + fontSize * 0.85);
    
    // Protocol — muted
    targetCtx.font = `400 ${fontSize * 0.25}px "JetBrains Mono", "Fira Code", monospace`;
    targetCtx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    targetCtx.fillText('SIFR-0 PROTOCOL  ·  AUDIT BEFORE ACT', cx, textY + fontSize * 1.5);
  }
  
  // Vignette
  const vig = targetCtx.createRadialGradient(cx, cy, w * 0.28, cx, cy, w * 0.72);
  vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vig.addColorStop(1, `rgba(${bgR},${bgG},${bgB}, 0.5)`);
  targetCtx.fillStyle = vig;
  targetCtx.fillRect(0, 0, w, h);
}

// Live preview
function draw() {
  const speed = hovered ? 0.05 : 0.02;
  time += speed;
  renderTorus(ctx, 512, time);
  animId = requestAnimationFrame(draw);
}
draw();

// Export
function captureFrame(exportSize = 2048) {
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = exportSize;
  exportCanvas.height = exportSize;
  const exportCtx = exportCanvas.getContext('2d');
  renderTorus(exportCtx, exportSize, time, variant);
  
  const link = document.createElement('a');
  link.download = `djzs-torus-${variant}-${exportSize}px.png`;
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
}
</script>

</body>
</html>
